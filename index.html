<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Khách O2O</title>
<meta name="theme-color" content="#0d6a54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Khách">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#15201c; --muted:#5b6964; --line:#d9e1de;
  --accent:#0d6a54; --accent-ink:#ffffff; --accent-soft:#dfefe9;
  --hot:#c2410c; --warm:#a86b12; --cold:#36679f; --danger:#b42318; --ok:#2c7a4b; --plain:#6b7a74;
  --shadow:0 10px 30px rgba(10,30,24,.14);
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1412; --surface:#16201c; --ink:#e4ebe8; --muted:#94a39d; --line:#2a3632;
  --accent:#4dbd9a; --accent-ink:#05231a; --accent-soft:#163329;
  --hot:#f08a5d; --warm:#e0b04f; --cold:#86aee0; --danger:#f2786c; --ok:#6cc08f; --plain:#9aa9a3;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);transform:rotate(45deg);display:inline-block}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who b{color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center}
main{padding-block:18px 40px;display:grid;gap:18px}
main>*,section{min-width:0}
[hidden]{display:none!important}
h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 200px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.btn{font:600 14px var(--f-body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
button.btn:hover{border-color:var(--accent)}
button.btn:disabled{opacity:.6;cursor:wait}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--danger)}
button.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
button.sm{padding:5px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 12px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--plain)}
.t-Nóng{background:var(--hot)} .t-Ấm{background:var(--warm)} .t-Lạnh{background:var(--cold)}
.card .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .meta{grid-column:2/4;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.card .next{grid-column:2/4;font-size:13px;font-weight:500}
.late{color:var(--danger)} .soon{color:var(--accent)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.s-Mới{color:var(--cold)} .s-Đang-chăm{color:var(--warm)} .s-Hẹn-xem-nhà{color:var(--hot)} .s-Đã-cọc{color:var(--accent)} .s-Ký-HĐ{color:var(--ok)} .s-Dừng{color:var(--plain)}
.u-Trống{color:var(--ok)} .u-Giữ-chỗ{color:var(--warm)} .u-Đã-cọc{color:var(--accent)} .u-Đã-bán{color:var(--plain)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:2px}
.unit:hover{border-color:var(--accent)}
.unit .code{font-family:var(--f-display);font-weight:600;font-size:16px}
.unit small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:40}
.sheet{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-b{overflow-y:auto;padding:16px 18px 28px;display:grid;gap:14px}
.f{display:grid;gap:4px} .f label{font-size:12px;font-weight:600;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.box.next{background:var(--accent-soft);border-color:transparent}
.log{display:grid;gap:8px;font-size:14px}
.log div{border-left:2px solid var(--line);padding-left:10px}
.log small{display:block;color:var(--muted);font-size:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick .ph{font-variant-numeric:tabular-nums;font-weight:600;user-select:all}
a.lnk{color:var(--accent);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.legend>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35}.legend b{display:block}.legend span{color:var(--muted)}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:grid;gap:14px}
.login .brand{font-size:24px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.nums input{font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.rep .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rep .hd b{font-size:15px}
.rep .figs{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rep p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.rep p small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rep .warn{border-left:3px solid var(--warm);padding-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.agentbox{background:var(--accent-soft);border-color:transparent}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk input{width:auto}
.tg{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.tg-0{color:var(--warm)}.tg-1{color:var(--accent)}.tg-2{color:var(--plain)}.tg-x{color:var(--danger);border-style:dashed}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.rule{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;gap:2px;font-size:13px}
.rule b{font-size:14px}
table.agt th{text-align:right}table.agt th.c{text-align:center;border-bottom:1px solid var(--line)}table.agt th:nth-child(-n+2),table.agt td:nth-child(-n+2){text-align:left}
.khus{display:grid;gap:8px}
.khu{display:grid;grid-template-columns:90px repeat(4,minmax(0,1fr)) minmax(0,1.6fr);gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.khu .kn{align-self:center;font-family:var(--f-display);font-size:16px;min-width:0}
.khu input[type=number]{font-variant-numeric:tabular-nums;font-weight:600;text-align:center;padding:8px 4px}
.khu .f label{font-size:11px}
.khu .f label small{display:block;font-weight:400;line-height:1.3;margin-top:2px}.kt td small{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.3}
.klist{display:grid;gap:4px}
.kl{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;align-items:baseline}
.kl>b{min-width:64px}.kl span{color:var(--muted);font-variant-numeric:tabular-nums}.kl span b{color:var(--ink)}
.kl em{font-style:normal;color:var(--accent)}
table.kt{font-size:13px}table.kt th,table.kt td{padding:6px 10px}
@media (max-width:640px){.khu{grid-template-columns:repeat(4,minmax(0,1fr))}.khu .kn,.khu .kno{grid-column:1/-1}}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.miss{background:transparent;border:1px solid var(--danger);color:var(--danger)}
@media (max-width:560px){.who{margin-left:0;width:100%}.f2{grid-template-columns:1fr}.card{grid-template-columns:auto 1fr}.card .pill{grid-column:2}.card .meta,.card .next{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="loginView" class="wrap" hidden>
  <form class="login" id="lf">
    <div class="brand"><i></i>Sổ Khách O2O</div>
    <div class="note">Đăng nhập bằng tên và mã PIN trưởng phòng cấp cho bạn.</div>
    <div class="f"><label for="l_name">Tên</label><input id="l_name" autocomplete="username" required></div>
    <div class="f"><label for="l_pin">Mã PIN</label><input id="l_pin" type="password" inputmode="numeric" autocomplete="current-password" required></div>
    <label for="l_rem" style="display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer"><input id="l_rem" type="checkbox" style="width:18px;height:18px;margin:0;flex:none"> Ghi nhớ mã PIN trên máy này</label>
    <div class="note" style="margin-top:-8px">Chỉ bật trên điện thoại / máy tính của riêng bạn.</div>
    <button class="btn primary" type="submit" id="l_btn">Đăng nhập</button>
    <div class="note" id="l_err"></div>
  </form>
</div>

<div id="appView" hidden>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i></i>Sổ Khách O2O</div>
      <div class="who"><span>Xin chào <b id="meName"></b></span><button class="btn sm" data-act="reload">Tải lại</button><button class="btn sm" data-act="logout">Thoát</button></div>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="agent" role="tab">Số Khách Tiếp Cận<span class="n" id="nAgent" hidden></span></button>
      <button data-tab="weekly" role="tab">Báo cáo tuần<span class="n" id="nDaily" hidden></span></button>
      <button data-tab="today" role="tab">Cần chăm hôm nay<span class="n" id="nToday" hidden></span></button>
      <button data-tab="cust" role="tab">Khách hàng</button>
      <button data-tab="report" role="tab">Báo cáo</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
const STATUSES=["Mới","Đang chăm","Hẹn xem nhà","Đã cọc","Ký HĐ","Dừng"];
const TEMPS=["Nóng","Ấm","Lạnh"];
const AGENT_SRC="Agent Vinhomes";
const SOURCES=[AGENT_SRC,"Facebook","Zalo","TikTok","Người quen giới thiệu","Sự kiện / mở bán","Tờ rơi / tại dự án","Khác"];
const PROJECTS=["Happy Home Phố Hiến","Happy Home Tràng Cát","Dự án khác"];
const UNIT_ST=["Trống","Giữ chỗ","Đã cọc","Đã bán"];
const S={token:null,me:null,tab:"today",scope:"all",q:"",fs:"",ft:"",fo:"",uf:"",at:"",aw:"",ad:"",agReports:[],agLoaded:false,agToday:"",newAgent:false,uq:"",customers:[],units:[],staff:[],loaded:false,wreports:[],wLoaded:false,wEdit:false,today:"",week:"",rw:"",draft:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls=v=>String(v).replace(/\s+/g,"-");
const opts=(arr,v,blank)=>(blank!==undefined?`<option value="">${blank}</option>`:"")+arr.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("");
const pad=n=>String(n).padStart(2,"0");
const toInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmt=s=>{if(!s)return"";const d=new Date(s);if(isNaN(d))return"";const t=new Date();const tm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const y=new Date(t);y.setDate(t.getDate()+1);if(d.toDateString()===t.toDateString())return`Hôm nay ${tm}`;if(d.toDateString()===y.toDateString())return`Mai ${tm}`;return`${tm} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const digits=p=>String(p||"").replace(/\D/g,"");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function toast(m,ms){const r=$("#toastRoot");r.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",ms||2600)}
const API="https://script.google.com/macros/s/AKfycbxVaZnvCnYSuwT4zIt0lFn9BDb_dW9PMAPygIeKnM6DQhiYa2bYatHTpjxwXDmW-hAc/exec";
const api=(fn,...a)=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args:a})}).then(r=>r.json()).then(r=>{if(!r.ok)throw new Error(r.error);return r.data});
const errMsg=e=>String(e&&e.message||e).replace(/^Error:\s*/,"");

const isMgr=()=>S.me&&S.me.mgr;
const visible=()=>{let a=S.customers;if(isMgr()&&S.scope==="mine")a=a.filter(c=>c.owner===S.me.name);if(isMgr()&&S.fo)a=a.filter(c=>c.owner===S.fo);return a};
const active=c=>c.status!=="Dừng"&&c.status!=="Ký HĐ";
function careGroups(){
  const now=new Date(),end=new Date();end.setHours(23,59,59,999);const week=Date.now()-7*864e5;
  const late=[],today=[],cold=[];
  for(const c of visible()){if(!active(c))continue;const n=c.nextAt?new Date(c.nextAt):null;
    if(n&&n<now)late.push(c);else if(n&&n<=end)today.push(c);
    else if(!n&&new Date(c.lastCareAt||c.createdAt||0).getTime()<week)cold.push(c)}
  const by=(a,b)=>String(a.nextAt).localeCompare(String(b.nextAt));
  return{late:late.sort(by),today:today.sort(by),cold}
}
function card(c){
  const n=c.nextAt?new Date(c.nextAt):null;const late=n&&n<new Date();
  return `<button class="card" data-open="${esc(c.id)}">
    <span class="dot t-${esc(c.temp||"")}" title="${esc(c.temp||"")}"></span>
    <span class="nm">${esc(c.name||"(chưa có tên)")}</span>
    <span class="pill s-${esc(cls(c.status||"Mới"))}">${esc(c.status||"Mới")}</span>
    <span class="meta">${esc([c.phone,c.project,c.need].filter(Boolean).join(" · "))}${isMgr()?` · <b>${esc(c.owner||"Chưa giao")}</b>`:""}</span>
    ${n?`<span class="next ${late?"late":"soon"}">${late?"Trễ hẹn":"Hẹn"}: ${esc(fmt(c.nextAt))}${c.nextNote?` — ${esc(c.nextNote)}`:""}</span>`:""}
  </button>`
}
const emptyBox=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;
const staffNames=()=>S.staff.filter(s=>s.active!=="Không").map(s=>s.name);
function scopeCtl(){if(!isMgr())return"";return `<div class="seg" role="group"><button data-scope="all" aria-pressed="${S.scope==="all"}">Cả phòng</button><button data-scope="mine" aria-pressed="${S.scope==="mine"}">Khách của tôi</button></div>
  ${S.scope==="all"?`<select id="fo" style="width:auto">${opts(staffNames(),S.fo,"Mọi nhân viên")}</select>`:""}`}

function viewToday(){
  const g=careGroups();const v=visible();const cnt=s=>v.filter(c=>c.status===s).length;
  const sec=(t,arr,e)=>`<section><h3>${t} (${arr.length})</h3>${arr.length?`<div class="list">${arr.map(card).join("")}</div>`:`<div class="note">${e}</div>`}</section>`;
  return `<div class="row"><h2 class="grow">Việc chăm khách hôm nay</h2>${scopeCtl()}<button class="btn primary" data-act="new">+ Thêm khách</button></div>
  <div class="stats">
    <div class="stat"><b>${v.filter(active).length}</b><span>Khách đang theo</span></div>
    <div class="stat"><b>${v.filter(c=>c.temp==="Nóng"&&active(c)).length}</b><span>Khách nóng</span></div>
    <div class="stat"><b>${cnt("Hẹn xem nhà")}</b><span>Hẹn xem nhà</span></div>
    <div class="stat"><b>${cnt("Đã cọc")+cnt("Ký HĐ")}</b><span>Đã cọc / ký HĐ</span></div>
  </div>
  ${!v.length?emptyBox("Chưa có khách nào","Bấm “+ Thêm khách” để nhập khách đầu tiên. Đặt lịch hẹn chăm, tới ngày khách sẽ hiện ở trang này."):

function viewWeeklyMgr(){

    :emptyBox("Chưa có nhân viên nào","Thêm nhân viên ở tab Báo cáo để theo dõi ai đã nộp báo cáo tuần.")}
  ${reps.length?`<section><h3>Theo nhân viên</h3><div class="tbl"><table><thead><tr><th>Nhân viên</th><th>Hạn nộp</th>${STG.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>
    ${names.map(n=>`<tr><td>${esc(n)}</td><td>${repOf(w,n)?(repOf(w,n).late==="Muộn"?"Nộp muộn":"Đúng hạn"):"Chưa nộp"}</td>${cells(repOf(w,n))}</tr>`).join("")}
    <tr style="font-weight:700"><td>Cả phòng</td><td>${reps.filter(r=>r.late==="Muộn").length} muộn</td>${STG.map(([k])=>`<td>${sum(k)}</td>`).join("")}</tr></tbody></table></div></section>
  <section><h3>Theo khu</h3><div class="tbl"><table><thead><tr><th>Khu</th>${STG.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>

  $("#sheetRoot").innerHTML=sheetShell(s?"Sửa nhân viên":"Thêm nhân viên",`<form class="sheet-b" id="sf">
    <div class="f"><label for="s_name">Tên đăng nhập</label><input id="s_name" required value="${esc(d.name)}" ${s?"readonly":""} placeholder="VD: Thuận"></div>
    <div class="f"><label for="s_team">Leader / Team</label><input id="s_team" list="teamList" value="${esc(d.team)}" placeholder="VD: Team Phong"><datalist id="teamList">${[...new Set(S.staff.map(x=>x.team).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
    <div class="f"><label for="s_pin">Mã PIN</label><input id="s_pin" required value="${esc(d.pin)}" inputmode="numeric"></div>
    <div class="f2"><div class="f"><label for="s_role">Vai trò</label><select id="s_role">${opts(["Nhân viên","Quản lý"],d.role)}</select></div>
    <div class="f"><label for="s_active">Trạng thái</label><select id="s_active"><option value="Có"${d.active!=="Không"?" selected":""}>Đang làm</option><option value="Không"${d.active==="Không"?" selected":""}>Đã nghỉ</option></select></div></div>
    <p class="note">Tên đăng nhập không đổi được sau khi tạo, vì khách đang gắn theo tên này.</p>
    <button class="btn primary" type="submit">Lưu</button></form>`);
}

/* ---------- Ghi dữ liệu ---------- */
const v=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
async function run(fn,ok,btn){if(btn)btn.disabled=true;try{const r=await fn();if(ok)toast(ok);return r||true}
  catch(e){const m=errMsg(e);if(m==="AUTH")showLogin("Phiên đăng nhập đã hết, vui lòng đăng nhập lại.");else toast(m,4000);return false}
  finally{if(btn)btn.disabled=false}}
async function saveCustomer(form){
  const id=form.dataset.id;
  const data={id,name:v("c_name"),phone:v("c_phone"),status:v("c_status"),temp:v("c_temp"),project:v("c_project"),source:v("c_source"),need:v("c_need"),area:v("c_area"),doc:v("c_doc"),note:v("c_note"),nextAt:v("c_next"),nextNote:v("c_nextNote"),owner:v("c_owner"),agentTag:v("c_agentTag"),agentAt:v("c_agentAt"),agentOk:!!($("#c_agentOk")&&$("#c_agentOk").checked)};
  if(!data.name){toast("Nhập tên khách trước khi lưu");return}
  const force=form.dataset.dupOk==="1";
  const r=await run(()=>api("saveCustomer",S.token,data,force),null,$("#c_save"));if(!r)return;
  if(r.dup){form.dataset.dupOk="1";toast(`Số này đã có trong sổ, do ${r.dup} phụ trách. Bấm Lưu lần nữa nếu vẫn muốn thêm.`,5000);return}
  toast(id?"Đã lưu thay đổi":"Đã thêm khách");closeSheet();load(true);
}
async function addLog(){const f=$("#cf");const t=v("c_log");if(!f||!t)return;const id=f.dataset.id;
  if(await run(()=>api("addLog",S.token,id,t),"Đã ghi nhật ký")){await load(true);openCustomer(id)}}
async function saveUnit(form){
  const data={id:form.dataset.id,code:v("u_code"),status:v("u_status"),project:v("u_project"),block:v("u_block"),floor:v("u_floor"),area:v("u_area"),price:v("u_price"),customer:v("u_customer"),note:v("u_note")};
  if(!data.code){toast("Nhập mã căn trước khi lưu");return}
  if(await run(()=>api("saveUnit",S.token,data),"Đã lưu căn")){closeSheet();load(true)}
}
async function saveStaffForm(){
  const data={name:v("s_name"),pin:v("s_pin"),role:v("s_role"),active:v("s_active"),team:v("s_team")};
  if(await run(()=>api("saveStaff",S.token,data),"Đã lưu nhân viên")){closeSheet();load(true)}
}

/* ---------- Sự kiện ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-act]");if(!t)return;
  if(t.dataset.tab){if(S.tab==="weekly")readDraft();S.tab=t.dataset.tab;ls("tab",S.tab);render();return}
  if(t.dataset.scope){S.scope=t.dataset.scope;render();return}
  if(t.dataset.uf!==undefined){S.uf=t.dataset.uf;render();return}
  if(t.dataset.at!==undefined){S.at=t.dataset.at;render();return}
  if(t.dataset.ad){S.ad=t.dataset.ad;render();return}
  if(t.dataset.adshift){const nd=addD(S.ad||S.agToday,+t.dataset.adshift);if(nd<=S.agToday){S.ad=nd;render()}return}
  if(t.dataset.open){openCustomer(t.dataset.open);return}
  if(t.dataset.unit){openUnit(t.dataset.unit);return}
  if(t.dataset.staff){openStaff(+t.dataset.staff);return}
  if(t.dataset.rw){readDraft();S.rw=t.dataset.rw;S.wEdit=false;render();return}
  if(t.dataset.rwshift){const nw=addD(S.rw||S.week,+t.dataset.rwshift);if(nw<=S.week){S.rw=nw;render()}return}
  if(t.dataset.copy){const p=t.dataset.copy;try{await navigator.clipboard.writeText(p);toast("Đã chép "+p)}catch(err){toast("Giữ tay lên số "+p+" để chép")}return}
  if(t.dataset.in){const el=$("#c_next");if(t.dataset.in==="0"){el.value="";$("#c_nextNote").value=""}else{const d=new Date();d.setDate(d.getDate()+ +t.dataset.in);d.setHours(9,0,0,0);el.value=toInput(d)}return}
  const a=t.dataset.act;
  if(a==="close")closeSheet();
  else if(a==="new")openCustomer(null);
  else if(a==="newUnit")openUnit(null);
  else if(a==="newAgent"){S.newAgent=true;openCustomer(null)}
  else if(a==="copyAgent"){const txt=agentTSV();try{await navigator.clipboard.writeText(txt);toast("Đã chép bảng (Nhân sự, Leader, Agent, Nguồn khác, Tổng). Mở Google Sheet, bấm ô đầu tiên rồi Ctrl+V",5000)}catch(err){toast("Trình duyệt chặn chép tự động, hãy thử lại trên Chrome",5000)}}
  else if(a==="agRemind"){const d=S.ad||S.agToday;const msg=`Nhắc ${agMissing(d).join(", ")}: chưa báo số khách tiếp cận ngày ${dm(d)} trên Sổ Khách O2O (tab Số Khách Tiếp Cận).`;try{await navigator.clipboard.writeText(msg);toast("Đã chép tin nhắc, dán vào nhóm Zalo")}catch(err){toast(msg,6000)}}
  else if(a==="newStaff")openStaff(null);
  else if(a==="log")addLog();
  else if(a==="wCancel"){S.wEdit=false;S.draft=null;render()}
  else if(a==="addKhu"){readDraft();S.draft.items.push({khu:"",thu:"",p90:"",du:"",nop:"",note:""});render();const i=S.draft.items.length-1;const el=document.getElementById("w_khu_"+i);if(el)el.focus()}
  else if(a==="copyRemind"){const w=S.rw||S.week;const miss=teamNames().filter(x=>!repOf(w,x));const msg=`Nhắc ${miss.join(", ")}: chưa gửi báo cáo hồ sơ tuần ${wkLabel(w)} trên Sổ Khách O2O (tab Báo cáo tuần), hạn ${dlLabel(w)}.`;try{await navigator.clipboard.writeText(msg);toast("Đã chép tin nhắc, dán vào nhóm Zalo")}catch(err){toast(msg,6000)}}
  else if(a==="reload"){if(await load())toast("Đã cập nhật")}
  else if(a==="logout"){const tk=S.token;showLogin("");if(tk)api("logout",tk).catch(()=>{})}
  else if(a==="del"||a==="delUnit"){
    if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Bấm lần nữa để xoá";setTimeout(()=>{t.classList.remove("armed");t.textContent="Xoá"},4000);return}
    const id=t.closest("form").dataset.id;
    if(await run(()=>api(a==="del"?"deleteCustomer":"deleteUnit",S.token,id),"Đã xoá",t)){closeSheet();load(true)}
  }
});
document.addEventListener("submit",e=>{const id=e.target.id;if(id==="lf")return;e.preventDefault();
  if(id==="cf")saveCustomer(e.target);if(id==="uf")saveUnit(e.target);if(id==="sf")saveStaffForm();if(id==="wf")saveWeeklyForm();if(id==="agf")saveAgentForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.id==="c_log"){e.preventDefault();addLog()}});
document.addEventListener("input",e=>{const id=e.target.id;if(id==="q"){S.q=e.target.value;render()}if(id==="uq"){S.uq=e.target.value;render()}});
document.addEventListener("change",e=>{const id=e.target.id;if(id==="c_source"){const b=$("#agentBox");if(b){b.hidden=e.target.value!==AGENT_SRC;if(!b.hidden&&!v("c_agentAt"))$("#c_agentAt").value=localDay(new Date())}}if(id==="c_agentTag"){$("#tagHint").textContent=tagInfo(e.target.value).hint}if(id==="ag_date"&&e.target.value){S.ad=e.target.value>S.agToday?S.agToday:e.target.value;render()}if(id==="fs"){S.fs=e.target.value;render()}if(id==="ft"){S.ft=e.target.value;render()}if(id==="fo"){S.fo=e.target.value;render()}});
const typing=()=>(S.tab==="weekly"||S.tab==="agent")&&!isMgr();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.token&&!typing())load(true)});
setInterval(()=>{if(S.token&&!document.hidden&&!$("#sheetRoot").innerHTML&&!typing())load(true)},90000);

(function boot(){
  S.tab=ls("tab")||"agent";$("#l_name").value=ls("lastName")||"";$("#l_rem").checked=ls("rem")==="1";$("#l_pin").value=ls("rem")==="1"?(ls("lastPin")||""):"";
  const start=k=>{S.token=k||ls("tok");if(S.token){ls("tok",S.token);keep(S.token);$("#appView").hidden=false;render();load()}else showLogin("")};
  start("")
})();
</script>
</body>
</html>
